<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KDS - Kitchen Display System</title>
    <base href="/" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body style="margin: 0; padding: 0; background-color: #0b1120; overflow: hidden; font-family: 'Cairo', 'Outfit', sans-serif;">
    <div id="app">
        <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: #0b1120; color: #94a3b8;">
            <div style="font-size: 1.5rem; font-weight: 800; color: #10b981; margin-bottom: 12px;">نظام شاشات المطبخ والاستلام (KDS)</div>
            <div>جاري بدء تشغيل النظام...</div>
        </div>
    </div>

    <script src="_framework/blazor.webview.js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script>
        // Automatic persistent focus keeper
        window.kdsFocus = {
            currentContainer: null,
            init: function (element) {
                this.currentContainer = element;
                this.ensureFocus();
                
                // Keep focus when clicking anywhere in window
                window.addEventListener('click', () => {
                    setTimeout(() => window.kdsFocus.ensureFocus(), 50);
                });
                
                // If focus is lost, re-focus
                window.addEventListener('blur', () => {
                    setTimeout(() => window.kdsFocus.ensureFocus(), 100);
                });
            },
            ensureFocus: function () {
                if (this.currentContainer) {
                    try {
                        this.currentContainer.focus();
                    } catch (e) { }
                }
            }
        };

        // Web Audio API Chime for Kitchen & Pickup alerts (no external sound file needed)
        window.kdsAudio = {
            playNewOrder: function () {
                try {
                    const ctx = new (window.AudioContext || window.webkitAudioContext)();
                    const now = ctx.currentTime;
                    const osc1 = ctx.createOscillator();
                    const gain1 = ctx.createGain();
                    osc1.type = 'sine';
                    osc1.frequency.setValueAtTime(587.33, now); // D5
                    osc1.frequency.exponentialRampToValueAtTime(880, now + 0.15); // A5
                    gain1.gain.setValueAtTime(0.3, now);
                    gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
                    osc1.connect(gain1);
                    gain1.connect(ctx.destination);
                    osc1.start(now);
                    osc1.stop(now + 0.5);

                    const osc2 = ctx.createOscillator();
                    const gain2 = ctx.createGain();
                    osc2.type = 'sine';
                    osc2.frequency.setValueAtTime(1174.66, now + 0.18); // D6
                    gain2.gain.setValueAtTime(0.4, now + 0.18);
                    gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
                    osc2.connect(gain2);
                    gain2.connect(ctx.destination);
                    osc2.start(now + 0.18);
                    osc2.stop(now + 0.8);
                } catch (e) {
                    console.warn("Audio play error", e);
                }
            },
            playReadyChime: function () {
                try {
                    const ctx = new (window.AudioContext || window.webkitAudioContext)();
                    const now = ctx.currentTime;
                    [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(freq, now + i * 0.1);
                        gain.gain.setValueAtTime(0.25, now + i * 0.1);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.1 + 0.6);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(now + i * 0.1);
                        osc.stop(now + i * 0.1 + 0.6);
                    });
                } catch (e) {
                    console.warn("Audio play error", e);
                }
            }
        };

        // Dense Masonry Layout for KDS & Pickup
        window.kdsMasonry = {
            rafId: null,
            init: function () {
                window.addEventListener('resize', () => window.kdsMasonry.update());
                this.update();
            },
            update: function () {
                if (this.rafId) cancelAnimationFrame(this.rafId);
                this.rafId = requestAnimationFrame(() => {
                    const grids = document.querySelectorAll('.kds-grid, .pickup-grid');
                    grids.forEach(grid => {
                        const tickets = grid.querySelectorAll('.kds-ticket, .pickup-ticket');
                        if (!tickets.length) return;

                        const rowHeight = 8;
                        const rowGap = 12; // 0.75rem ≈ 12px

                        tickets.forEach(t => {
                            let contentHeight = 0;
                            for (let i = 0; i < t.children.length; i++) {
                                contentHeight += t.children[i].offsetHeight;
                            }
                            const h = Math.max(contentHeight + 10, t.scrollHeight);
                            if (h > 0) {
                                const span = Math.ceil((h + rowGap) / (rowHeight + rowGap));
                                t.style.gridRowEnd = `span ${span}`;
                            }
                        });
                    });
                });
            }
        };
    </script>
</body>
</html>
