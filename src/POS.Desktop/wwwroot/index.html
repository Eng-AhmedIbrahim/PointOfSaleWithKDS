<body>
    <div id="app">
        <div style="text-align: center; padding: 50px;">
            <h2>Loading...</h2>

        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"

    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.0.1/chart.umd.js"
        integrity="sha512-gQhCDsnnnUfaRzD8k1L5llCCV6O9HN09zClIzzeJ8OJ9MpGmIlCxm+pdCkqTwqJ4JcjbojFr79rl2F1mzcoLMQ=="

        src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js"

    <script src="_content/Blazor.Bootstrap/blazor.bootstrap.js"></script>
    <script src="site.js"></script>

    <script>
        window.barcodeFocus = {
            init: function () {
                setTimeout(function () {
                    var el = document.querySelector('.pos-barcode-field input');
                    if (el) el.focus();
                }, 300);
            }
        };
    </script>


    <script>
        function setTableItemCount(count) {
            localStorage.setItem('tableItemCount', count);
        }

        window.addEventListener('beforeunload', function (event) {
            const count = localStorage.getItem('tableItemCount') || 0;
            if (count > 0) {
                event.preventDefault();
                event.returnValue = 'You have unfinished orders. Please finish them before leaving.';
            }
        });

        document.addEventListener('visibilitychange', function () {
            if (document.visibilityState === 'hidden') {
                clearTableItems();
            }
        });

        function clearTableItems() {
            localStorage.removeItem('tableItemCount');
            console.log('Table items cleared');
        }

        let lastEnterTime = 0;

        window.listenToDoubleEnter = function (dotNetHelper) {
            document.addEventListener('keydown', function (e) {
                if (e.key === 'Enter') {
                    e.preventDefault();

                    const now = Date.now();
                    if (now - lastEnterTime < 500) {
                        dotNetHelper.invokeMethodAsync("ExecuteDoubleEnterFunction");
                    }
                    lastEnterTime = now;
                }
            });
        };
    </script>
</body>
